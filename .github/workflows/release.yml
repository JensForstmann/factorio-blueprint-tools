name: Release

on:
  release:
    types:
      - published
  push:
    tags:
      - '*'
  workflow_dispatch:

# npm Trusted Publisher: https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Install latest npm # Ensure latest npm for trusted publishing
        run: sudo npm install -g npm@latest
      - name: Install Dependencies
        run: npm clean-install
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish
