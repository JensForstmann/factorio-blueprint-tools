name: Release

on:
  release:
    types:
      - published
  push:
    tags:
      - '*'
  workflow_dispatch:

# npm Trusted Publisher: https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm clean-install
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish
